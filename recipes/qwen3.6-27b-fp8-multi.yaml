recipe_version: '2'
model: Qwen/Qwen3.6-27B-FP8
runtime: vllm
builder: eugr
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
metadata:
  description: "Qwen3.6-27B-FP8 — multi-model co-tenant variant (shares Spark with 35B-A3B + 1.7B + embedding)"
mods:
- mods/fix-qwen3-coder-next
- mods/fix-qwen3.5-chat-template
defaults:
  port: 8003
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  # Co-tenant budget: ~40% of unified memory. Dense 27B w/ GQA (8 KV heads, 64 layers)
  # spends ~131 KB/token at FP8 KV — 128k context ≈ 17 GB KV cache.
  gpu_memory_utilization: 0.40
  max_model_len: 131072
  max_num_batched_tokens: 16384
  load_format: instanttensor
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --chat-template unsloth.jinja \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
    --default-chat-template-kwargs '{"preserve_thinking": true}' \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
