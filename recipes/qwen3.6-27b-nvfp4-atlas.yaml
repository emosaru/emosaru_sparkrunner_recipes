recipe_version: "2"
model: vrfai/Qwen3.6-27B-NVFP4
runtime: atlas
container: avarok/atlas-gb10:latest
max_nodes: 1

metadata:
  description: |
    Qwen3.6-27B Dense NVFP4 on Atlas — adapted from
    @atlas/qwen3.5-27b-dense-nvfp4. Atlas supplies an NVFP4 KV cache and
    its own scheduler/watchdog (the dense Qwen 27B variants share a known
    post-`</think>` repetition attractor that the loop_watchdog catches).

    TODO: BLOCKED on Atlas kernel support. As of 2026-05-11 the
    avarok/atlas-gb10:latest binary errors at startup with:
      "No compiled kernel target matches model_type 'qwen3_6_moe' /
       hidden_size=5120"
    Available targets ship qwen3.5-27b (3.5 dense) and qwen3.6-35b-a3b
    (3.6 MoE) but not 3.6-27b dense. Re-test when a new atlas-gb10 image
    lands and check `spark serve --help` / kernel-target list for
    `qwen3.6-27b` before re-enabling.
  maintainer: emosaru
  category: agent
  model_params: 27B
  model_dtype: nvfp4
  quantization: nvfp4
  kv_dtype: nvfp4

defaults:
  port: 8003
  # NOTE: do NOT set `host:` — this Atlas build (avarok/atlas-gb10:latest)
  # rejects `--host`; sparkrun's atlas plugin still maps it. Atlas binds
  # 0.0.0.0 by default.
  max_model_len: 8192
  kv_cache_dtype: nvfp4
  gpu_memory_utilization: 0.88
  scheduling_policy: slai
