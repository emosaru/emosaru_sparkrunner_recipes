recipe_version: '2'
model: Qwen/Qwen3-1.7B-FP8
runtime: vllm
builder: eugr
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
metadata:
  description: "Qwen3-1.7B-FP8 — smoke-test variant with a roomier memory budget so KV cache fits after CUDA-graph profiling reserves its share"
mods:
- mods/fix-qwen3-coder-next
- mods/fix-qwen3.5-chat-template
defaults:
  port: 8002
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  # 0.04 leaves 0 GiB for KV after recent vLLM CUDA-graph profiling change.
  # 0.08 gives ~10 GB total budget; CUDA graphs + 2k context fit comfortably.
  gpu_memory_utilization: 0.08
  max_model_len: 4096
  max_num_batched_tokens: 8192
  load_format: instanttensor
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --chat-template unsloth.jinja \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    --default-chat-template-kwargs '{"preserve_thinking": true}' \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
