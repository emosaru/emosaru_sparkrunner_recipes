recipe_version: '1'
model: Qwen/Qwen3.5-122B-A10B-FP8
runtime: vllm-ray
builder: eugr
min_nodes: 2
container: vllm-node
cluster_only: true
mods:
- mods/fix-qwen3.5-chat-template
metadata:
  description: vLLM/Ray serving Qwen3.5-122B-A10B-FP8 across 2 Sparks, thinking disabled by default
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.65
  max_model_len: 262144
  max_num_batched_tokens: 8192
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 2}'
  kv_cache_dtype: fp8
command: |
  vllm serve Qwen/Qwen3.5-122B-A10B-FP8 \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --load-format fastsafetensors \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --override-generation-config '{"enable_thinking": false}' \
    --chat-template unsloth.jinja \
    -tp {tensor_parallel} --distributed-executor-backend ray \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype {kv_cache_dtype} \
    --speculative-config '{speculative_config}'
