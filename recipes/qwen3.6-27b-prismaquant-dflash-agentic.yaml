recipe_version: '2'
model: rdtand/Qwen3.6-27B-PrismaQuant-5.5bit-vllm
runtime: vllm
builder: eugr
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
metadata:
  description: "Qwen3.6-27B-PrismaQuant-5.5bit + DFlash spec decode (k=5) — agentic-coding co-tenant"
mods:
- mods/fix-qwen3-coder-next
- mods/fix-qwen3.6-chat-template
# Variant of qwen3.6-27b-prismaquant-agentic.yaml that swaps MTP-3 for
# DFlash drafting with the z-lab/Qwen3.6-27B-DFlash purpose-trained draft
# model. Community reports ~+40-50% throughput over MTP on Qwen3.6 (per
# forums.developer.nvidia.com/t/qwen3-6-27b-dflash-link/367803).
#
# Caveats vs the MTP variant:
#   - First launch pulls z-lab/Qwen3.6-27B-DFlash (~few GB) from HF.
#   - Thread used --attention-backend flash_attn (NOT flashinfer); DFlash
#     + flashinfer was not validated. We use flashinfer anyway because
#     flash_attn doesn't support kv_cache_dtype=fp8 in this vLLM build and
#     dropping FP8 KV would halve our context budget at util=0.40. Watch
#     spec_decode_num_accepted_tokens to confirm DFlash works with flashinfer.
#   - Spec-decode paths can ignore presence_penalty/repetition_penalty,
#     which has caused "endless loop while coding" reports with MTP on
#     Qwen3.6 — watch for this in agentic loops.
#   - PrismaQuant 5.5-bit target + DFlash combo is untested in the thread
#     (their setups used FP8 target). Target quant is orthogonal to draft
#     model, but flag if you see acceptance-rate anomalies.
#   - Draft model adds ~1-2 GB of weights to the budget. Dropping
#     num_gpu_blocks_override from 194 → 160 keeps KV under the util=0.40
#     budget with margin.
defaults:
  port: 8003
  host: 0.0.0.0
  gpu_memory_utilization: 0.40
  max_model_len: 131072
  # BF16 KV (default — fp8 KV would unify-fail against the DFlash drafter
  # per vLLM #41559: target fp8 pages and drafter bf16 pages can't share a
  # cache group). BF16 doubles KV/token, so num_gpu_blocks_override drops
  # 160 → 80 to keep us within the util=0.40 budget.
  num_gpu_blocks_override: 80
  max_num_seqs: 5
  load_format: fastsafetensors
  attention_backend: flashinfer
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
env:
  VLLM_USE_V1: '1'
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  # Setting to '0' should disable in-depth CUDA-graph profiling per vLLM
  # docs, but in v0.20.2rc1.dev299 the engine still crashes during
  # profile_cudagraph_memory after the eagle head warmup. We work around
  # by adding --enforce-eager to the serve command, which skips CUDA-graph
  # capture entirely. Keeping this env in case the underlying bug is fixed
  # in a later vllm release.
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '0'
command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --load-format {load_format} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --num-gpu-blocks-override {num_gpu_blocks_override} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --attention-backend {attention_backend} \
    --enforce-eager \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --speculative-config '{"method":"dflash","model":"z-lab/Qwen3.6-27B-DFlash","num_speculative_tokens":5}' \
    --chat-template fixed_chat_template.jinja \
    --default-chat-template-kwargs '{"preserve_thinking": true}' \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser}
