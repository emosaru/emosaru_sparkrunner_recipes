recipe_version: '2'
model: rdtand/Qwen3.6-27B-PrismaQuant-5.5bit-vllm
runtime: vllm
builder: eugr
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
metadata:
  description: "Qwen3.6-27B-PrismaQuant-5.5bit — multi-model co-tenant variant (shares Spark with 35B-A3B + 1.7B + embedding)"
mods:
- mods/fix-qwen3-coder-next
- mods/fix-qwen3.5-chat-template
defaults:
  port: 8003
  host: 0.0.0.0
  # CUMULATIVE — see header note in qwen3-embedding-0.6B-multi.yaml.
  # Launch order (largest first): 35B → 27B (2nd) → 1.7B → embedding.
  # Own share here: 0.35 (≈42 GB on a 119 GB unified pool — fits 18.5 GB
  # weights + ~17 GB FP8 KV at 128k + workspace, with ~6 GB margin).
  gpu_memory_utilization: 0.78
  max_model_len: 131072
  # instanttensor doesn't support the 5.5-bit PrismaQuant format; stay on
  # fastsafetensors here.
  load_format: fastsafetensors
  kv_cache_dtype: fp8
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --load-format {load_format} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-dtype {kv_cache_dtype} \
    --enable-prefix-caching \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
    --chat-template unsloth.jinja \
    --default-chat-template-kwargs '{"preserve_thinking": true}' \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser}
