recipe_version: '2'
model: rdtand/Qwen3.6-27B-PrismaQuant-5.5bit-vllm
runtime: vllm
builder: eugr
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
metadata:
  description: "Qwen3.6-27B-PrismaQuant-5.5bit — multi-model co-tenant variant (shares Spark with 35B-A3B + 1.7B + embedding)"
mods:
- mods/fix-qwen3-coder-next
- mods/fix-qwen3.5-chat-template
defaults:
  port: 8003
  host: 0.0.0.0
  # gpu_memory_utilization caps this instance's share of total memory; vLLM's
  # profiler sizes the KV pool to fit that budget. Do NOT use
  # num_gpu_blocks_override here: this model is hybrid (Mamba + attention),
  # so vLLM aligns block_size to 1600 tokens to match mamba page size, and a
  # hand-picked block count silently becomes ~100× larger than intended and OOMs.
  # 0.30 × 121 GB ≈ 36 GB → ~21.5 GB weights + ~2 GB MTP draft + ~12 GB KV;
  # profiler picks ~464 blocks (~600k token capacity, 4.5× max context).
  # Launch this FIRST so dense-27B CUDA-graph capture spike has clean memory.
  gpu_memory_utilization: 0.30
  max_num_seqs: 4
  max_model_len: 131072
  # instanttensor doesn't support the 5.5-bit PrismaQuant format; stay on
  # fastsafetensors here.
  load_format: fastsafetensors
  kv_cache_dtype: fp8
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --load-format {load_format} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-dtype {kv_cache_dtype} \
    --enable-prefix-caching \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
    --chat-template unsloth.jinja \
    --default-chat-template-kwargs '{"preserve_thinking": true}' \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser}
