recipe_version: '2'
model: Qwen/Qwen3.6-35B-A3B-FP8
runtime: vllm
builder: eugr
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
metadata:
  description: "Qwen3.6-35B-A3B-FP8 with MTP — single-node co-located (tp=1), util 0.46, 64k context.
    Pinned to node 1 (.237) alongside the 27B TP=2 slice. No ComfyUI on node 1; full remaining budget
    given to 35B. Node 1 budget: 121 - 27 (OS) - 38.7 (27B slice @ 0.32) = 55.3 GB → util 0.46.
    Weights+workspace at TP=1 estimated ~45-47 GB; leaves ~8-10 GB for KV → 64k context (~8 GB KV).
    No NCCL (TP=1) so no collision with 27B's NCCL group."
mods:
- mods/fix-qwen3-coder-next
- mods/fix-qwen3.6-chat-template
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  # 0.46 × 121 GB ≈ 55.7 GB. Node 1 budget after OS (27) + 27B slice (38.7) = 55.3 GB (no ComfyUI).
  # Weights+workspace estimated ~45-47 GB at TP=1; ~8-10 GB left for KV → 64k context (~8 GB KV).
  gpu_memory_utilization: 0.46
  max_model_len: 65536
  max_num_batched_tokens: 16384
  max_num_seqs: 16
  load_format: instanttensor
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 2}'
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  # Disable CUDA graph memory profiler (vLLM v0.21.0+) — consumes ~1 GB upfront at this tight budget.
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '0'
command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --trust-remote-code \
    --chat-template fixed_chat_template.jinja \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --speculative-config '{speculative_config}' \
    --enable-prefix-caching \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
