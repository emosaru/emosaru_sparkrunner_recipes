recipe_version: '1'
model: nvidia/Qwen3.6-35B-A3B-NVFP4
runtime: vllm-ray
builder: eugr
container: vllm-node
metadata:
  description: vLLM serving nvidia/Qwen3.6-35B-A3B-NVFP4 with Marlin MoE backend.
    Our version of @eugr/qwen3.6-35b-a3b-nvfp4 with the MTP speculative-config
    pre-expanded into a defaults variable (no inline '{{...}}' brace escaping).
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.4
  max_model_len: 262144
  max_num_seqs: 4
  max_num_batched_tokens: 8192
  speculative_config: '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
command: |
  vllm serve nvidia/Qwen3.6-35B-A3B-NVFP4 \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --kv-cache-dtype fp8 \
    --attention-backend flashinfer \
    --moe-backend marlin \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --speculative-config '{speculative_config}' \
    --load-format fastsafetensors \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --distributed-executor-backend ray
