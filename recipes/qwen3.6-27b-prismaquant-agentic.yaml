recipe_version: '2'
model: rdtand/Qwen3.6-27B-PrismaQuant-5.5bit-vllm
runtime: vllm
builder: eugr
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
metadata:
  description: "Qwen3.6-27B-PrismaQuant-5.5bit — agentic-coding co-tenant (with 35B), native 256k"
mods:
- mods/fix-qwen3-coder-next
- mods/fix-qwen3.6-chat-template
defaults:
  port: 8003
  host: 0.0.0.0
  # 0.40 × 121 GB ≈ 48 GB. Co-tenant with 35B (also 0.40). See note in
  # qwen3.6-35b-a3b-fp8-agentic.yaml on the KV-budget vs. earlyoom tradeoff.
  gpu_memory_utilization: 0.40
  # 128k context. Trimmed from 200k for more memory headroom. Block size
  # is aligned to the mamba page (1600 tokens); vLLM's profiler will fit
  # KV within the budget — do NOT add --num-gpu-blocks-override.
  max_model_len: 131072
  # Cap KV pool sizing. Without an override, vLLM's profiler filled the
  # whole gpu_memory_utilization budget (~36 GB) with ~590 blocks at the
  # 1600-token mamba-aligned block size — 7.2× max_model_len worth of KV.
  # 194 blocks ≈ 2.0× max_model_len effective concurrency (~10 GB KV).
  # vLLM pads ~25 blocks per profile to align padding layers, so raw
  # allocated tokens are higher than the reported effective count.
  # IMPORTANT: this value is tied to max_model_len AND block_size (1600
  # for this hybrid SSM model); recompute if either changes.
  num_gpu_blocks_override: 194
  # Allow up to 5 concurrent decoding sequences. The 194-block KV pool
  # fits 2 max-length (128k) sequences, but 5 short-context sequences
  # (e.g. 4k prompts) consume only ~21k of the 262k token budget — so this
  # only forces queuing on truly long concurrent prompts.
  max_num_seqs: 5
  # Prefill chunk size. Default is ~8192 which made 60k-prompt prefill take
  # 8 chunks at ~742 tok/s — bumping to 16384 cuts that in half. Measured
  # 60k benchmark cost was ~100s TTFT for 27B vs ~46s for the 35B which
  # had this set. Activation memory scales linearly with this value.
  max_num_batched_tokens: 16384
  load_format: fastsafetensors
  kv_cache_dtype: fp8
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
env:
  # Speeds up Marlin GEMM kernels (PrismaQuant 5.5-bit uses Marlin).
  # Already set on the 35B recipe for FP8 Marlin; same kernel family here.
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --load-format {load_format} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --num-gpu-blocks-override {num_gpu_blocks_override} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-dtype {kv_cache_dtype} \
    --enable-prefix-caching \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
    --chat-template fixed_chat_template.jinja \
    --default-chat-template-kwargs '{"preserve_thinking": true}' \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser}
