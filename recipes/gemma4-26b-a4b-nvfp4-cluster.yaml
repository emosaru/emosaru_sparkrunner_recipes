recipe_version: '2'
model: Neural-ICE/Gemma-4-26B-A4B-it-NVFP4
runtime: vllm-distributed
builder: eugr
min_nodes: 2
container: 192.168.1.236:5000/sparkrun-emosaru-vllm:latest
metadata:
  description: "Gemma 4 26B A4B MoE NVFP4 (Neural-ICE it variant) — TP=2 cluster, ray backend,
    util 0.20, 128k context. Port 8000 (hermes main LLM).
    Parsers: gemma4 tool-call + gemma4 reasoning (native Gemma4 format).
    --moe-backend cutlass: explicit SM 12.1 path; --generation-config vllm required for NVFP4."
mods:
- mods/fix-gemma4-nvml-memory
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  gpu_memory_utilization: 0.20
  max_model_len: 131072
  max_num_batched_tokens: 16384
  max_num_seqs: 4
env:
  ENABLE_NVFP4_SM100: '0'
  VLLM_NVFP4_GEMM_BACKEND: 'marlin'
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  NCCL_CUMEM_ENABLE: '1'
  NCCL_SOCKET_IFNAME: 'enp1s0f0np0,enP2p1s0f0np0'
  NCCL_TIMEOUT: '1800'
  NCCL_SOCKET_NTHREADS: '4'
  NCCL_NSOCKS_PERTHREAD: '2'

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --load-format instanttensor \
    --quantization modelopt \
    --kv-cache-dtype fp8 \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser gemma4 \
    --reasoning-parser gemma4 \
    --trust-remote-code \
    --moe-backend cutlass \
    --generation-config vllm \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
