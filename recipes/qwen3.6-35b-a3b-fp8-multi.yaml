recipe_version: '2'
model: Qwen/Qwen3.6-35B-A3B-FP8
runtime: vllm-distributed
builder: eugr
container: vllm-node
metadata:
  description: "Qwen3.6-35B-A3B-FP8 — multi-model co-tenant variant (shares Spark with 27B + 1.7B + embedding)"
mods:
- mods/fix-qwen3-coder-next
- mods/vllm-tune
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  # CUMULATIVE — see header note in qwen3-embedding-0.6B-multi.yaml.
  # Launch order (largest first): 35B (1st) → 27B → 1.7B → embedding.
  # Own share here: 0.43 (≈51 GB on a 119 GB unified pool — fits ~35 GB
  # weights + ~13 GB FP8 KV at 256k + workspace).
  gpu_memory_utilization: 0.43
  # Full 256k context — MoE attention (4 KV heads, 48 layers) keeps KV cache ~13 GB at FP8.
  max_model_len: 262144
  max_num_batched_tokens: 16384
  load_format: instanttensor
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
    --default-chat-template-kwargs '{"preserve_thinking": true}' \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
