recipe_version: '2'
model: Qwen/Qwen3.6-35B-A3B-FP8
runtime: vllm-distributed
builder: eugr
container: vllm-node
metadata:
  description: "Qwen3.6-35B-A3B-FP8 — multi-model co-tenant variant (shares Spark with 27B + 1.7B + embedding)"
mods:
- mods/fix-qwen3-coder-next
- mods/vllm-tune
- mods/fix-qwen3.6-chat-template
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  # gpu_memory_utilization caps this instance's share of total memory; vLLM's
  # profiler sizes the KV pool to fit that budget. Do NOT use
  # num_gpu_blocks_override: block_size depends on the model's attention/mamba
  # alignment and a hand-picked count can silently balloon KV memory.
  # 0.36 × 121 GB ≈ 43 GB → ~35 GB weights + ~6 GB FP8 KV + workspace.
  # (System/process overhead on Spark runs ~27 GB, not the ~20 GB initially
  # assumed — trimmed from 0.42 to leave room for embedding's 0.05 share.)
  gpu_memory_utilization: 0.36
  max_num_seqs: 4
  # 128k context — matched to 27B's max_model_len for predictable headroom
  # in the co-tenant stack. At util=0.36 the KV budget is ~3 GB; 128k fits
  # with comfortable margin (vs. tight 192k or failed 256k).
  max_model_len: 131072
  max_num_batched_tokens: 16384
  load_format: instanttensor
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
    --chat-template fixed_chat_template.jinja \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
