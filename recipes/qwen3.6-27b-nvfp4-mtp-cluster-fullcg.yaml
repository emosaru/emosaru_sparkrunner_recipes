recipe_version: '2'
model: emosaru/Qwen3.6-27B-NVFP4-MTP
runtime: vllm
min_nodes: 2
container: sparkrun-emosaru-vllm:latest
metadata:
  description: "FULL_AND_PIECEWISE + FP8 KV. emosaru custom vLLM fork (vLLM 0fa888465 + PR #41127 complete). Benchmark: ~30.8 tok/s avg single-stream, 181 tok/s @c=8. Rebuild: cd ~/code/spark-vllm-docker && ./build-and-copy.sh -t sparkrun-emosaru-vllm:latest --vllm-ref 0fa888465 --copy-to 192.168.1.237"
mods:
- mods/fix-nvfp4-mtp-weights
- mods/fix-qwen3-coder-next
- mods/fix-qwen3.6-chat-template
defaults:
  port: 8003
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  gpu_memory_utilization: 0.32
  max_model_len: 262144
  max_num_batched_tokens: 32768
  load_format: fastsafetensors
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 3}'
env:
  ENABLE_NVFP4_SM100: '0'
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  NCCL_CUMEM_ENABLE: '1'
  NCCL_SOCKET_IFNAME: 'enp1s0f0np0,enP2p1s0f0np0'

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --quantization modelopt \
    --chat-template fixed_chat_template.jinja \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --speculative-config '{speculative_config}' \
    --enable-prefix-caching \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
