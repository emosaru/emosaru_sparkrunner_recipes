recipe_version: '2'
model: Qwen/Qwen3.6-27B-FP8
runtime: vllm
builder: eugr
min_nodes: 2
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
metadata:
  description: "Qwen3.6-27B-FP8 with MTP — 2-Spark cluster (tp=2), budgeted as a co-tenant in the unified stack at full 256k context (~39 GB/node = util 0.32). Adapted from upstream @official/qwen3.6-27b-fp8-mtp-vllm (tp 1→2)."
mods:
- mods/fix-qwen3-coder-next
- mods/fix-qwen3.5-chat-template
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  # Unified-stack co-tenant budget at FULL 256k context: 0.32 × 121 GB ≈ 39 GB/node.
  # 27B dense GQA (8 KV heads, 64 layers) ≈ 128 KB/token FP8 KV; under TP=2
  # each node holds 4 KV heads ≈ 64 KB/token/node → 262144 ctx ≈ 16.4 GB/node KV
  # for one full-context seq. Weights ~13.5 GB/node + workspace ~7 GB + KV pool
  # ~18 GB ≈ ~39 GB/node fits util 0.32 with margin for slight concurrency.
  gpu_memory_utilization: 0.32
  max_model_len: 262144
  max_num_batched_tokens: 32768
  load_format: instanttensor
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 2}'
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  # Action 2: re-enable CUDA memory pooling for NCCL (image default is 0)
  NCCL_CUMEM_ENABLE: '1'
  # Action 3: remove 1GbE (enP7s7) from NCCL's socket fallback list; keep both 200Gb/s RoCE NICs
  NCCL_SOCKET_IFNAME: 'enp1s0f0np0,enP2p1s0f0np0'

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --chat-template unsloth.jinja \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --speculative-config '{speculative_config}' \
    --enable-prefix-caching \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
