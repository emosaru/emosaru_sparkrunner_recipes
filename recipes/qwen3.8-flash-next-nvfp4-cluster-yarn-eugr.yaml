# Recipe: Qwen3.8-Flash-Next-NVFP4 — YaRN / 1M context (dual-node cluster).
#
# Fork of recipes/qwen3.8-flash-next-nvfp4-cluster-eugr.yaml with RoPE scaling enabled.
# Deltas vs that file, and NOTHING else:
#   1. max_model_len 262144 -> 1000000
#   2. env VLLM_ALLOW_LONG_MAX_MODEL_LEN=1  (vLLM refuses len > native without it)
#   3. --hf-overrides setting text_config.rope_parameters to rope_type "yarn"
#
# ── THE OVERRIDE IS THE VENDOR'S, VERBATIM ────────────────────────────────────
# Copied from the Qwen/Qwen3.8-Flash-Next model card ("Processing Ultra-Long Texts"),
# which publishes this exact vLLM command line. We did not invent these numbers.
# Every key is required: dropping mrope_section/mrope_interleaved/partial_rotary_factor
# would silently rebuild a DIFFERENT rotary embedding than the checkpoint was trained with.
#
# ── WHY IT ACTUALLY WORKS HERE (verified in the b12x image, not assumed) ───────
# The danger with this model is that M-RoPE and YaRN could be mutually exclusive:
# get_rope() builds MRotaryEmbedding only under `scaling_type == "default"`, and QSA
# hard-fails with `RuntimeError: QSA M-RoPE requires mrope_section` if the rotary object
# lacks that attribute. Read the code in the shipped image: the `elif scaling_type ==
# "yarn"` branch has a dedicated `if "mrope_section" in rope_parameters` path that builds
# an **MRotaryEmbedding** carrying mrope_section + mrope_interleaved + scaling_factor, and
# MRotaryEmbedding itself imports yarn_get_mscale and applies `mscale`. So YaRN and M-RoPE
# compose properly. Had they not, this would have crashed loudly at load — not degraded
# silently — which is the one mercy of that code path.
#
# ── THE COST, FROM THE VENDOR'S OWN NOTE — READ BEFORE MAKING THIS THE DEFAULT ─
# "All the notable open-source frameworks implement STATIC YaRN, which means the scaling
#  factor remains constant regardless of input length, potentially impacting performance
#  on SHORTER texts. We advise modifying the rope_parameters configuration only when
#  processing long contexts is required. It is also recommended to modify the factor as
#  needed. For example, if the typical context length for your application is 524,288
#  tokens, it would be better to set factor as 2.0."
#
# Our dominant workload is short-context agentic coding, so this config taxes the common
# case to buy a capability we rarely use. Prefer the 262144 recipe unless you actually
# need >262k, and TUNE yarn_factor to the shortest scaling that covers your real contexts:
#     factor 2.0 ->   524,288    factor 4.0 -> 1,048,576 (len pinned to 1,000,000 here)
# `original_max_position_embeddings` must stay 262144 — it is the model's true native
# length and the denominator YaRN scales from, NOT a tunable.
#
# ── CAPACITY ──────────────────────────────────────────────────────────────────
# KV pool is fixed by memory (~3,149,610 tokens measured at gmu 0.7), so raising
# max_model_len does not shrink the pool — it re-divides it. Expect max concurrency to
# fall from ~12x @262k to ~3x @1M. That is arithmetic, not a regression.

# ── 2026-09-11: SWITCHED local-inference-lab -> nvidia, AND mtp 4 -> 3 ────────
# WHY THE CHECKPOINT CHANGED — the draft head was being quantized to 4 bits.
#   local-inference-lab: MTP experts at W4A16_NVFP4 (4-bit)   -> measured 2.52 tok/step
#   nvidia:              whole MTP module at FP8_BLOCK_SCALES -> 2.93 tok/step reported
# A draft head's entire job is to AGREE with the target, so 4-bit is exactly the wrong
# place to save space. nvidia's quant keeps the MTP module and the PLE n-gram embedding
# byte-identical to the FP8 release and only NVFP4s the 48 routed-expert layers
# (hf_quant_config: NVFP4 x48, FP8 x1, FP8_BLOCK_SCALES x1 — versus ours: MXFP8 x467,
# NVFP4 x48, W4A16_NVFP4 x29). Costs 123.6 GiB on disk vs 98.7.
# Reference: ai-muninn DGX Spark benchmark (nvidia quant, mtp=3): 2.93 tok/step, code
# acceptance 93/78/67% at positions 1-3, 41.7 tok/s median.
#
# WHY mtp 4 -> 3: eugr shipped 4; every DGX Spark forum thread uses 2 or 3, and our own
# per-position data showed position 3 accepted only ~10% of the time while costing a
# draft forward pass on EVERY step. 3 is also what the 2.93 tok/step reference used.
#
# NOTE the arch string differs between quants — nvidia declares Qwen4ExpForConditionalGeneration
# / model_type qwen4_exp (the upstream-PR naming), local-inference-lab declared
# Qwen3_8FlashNextForConditionalGeneration. The b12x image registers BOTH and aliases them
# onto the same vllm.models.qwen3_8_flash_next module, so either loads.
#
# The old checkpoint was DELETED from both nodes to make room (.237 could not hold both).
# Re-download pin if ever needed: local-inference-lab/Qwen3.8-Flash-Next-NVFP4 revision
# ada4da32a583a78aa47299f45a70603c950490b8.

# ── --enable-expert-parallel IS REQUIRED BY THE NVIDIA QUANT ──────────────────
# nvidia's MTP experts are block-FP8 with 128x128 blocks. Under pure TP=2 the MoE
# intermediate (640) is tensor-sliced to 320 per rank and the loader rejects it:
#   ValueError: The output_size of gate's and up's weight = 320 is not divisible by
#               weight quantization block_n = 128.
# Expert parallelism distributes whole experts instead of slicing their width, so each
# rank keeps the full 640 (640/128 = 5). This is exactly the published guidance for this
# checkpoint ("use expert parallelism so the MTP expert width remains compatible with its
# 128x128 FP8 blocks"). NOTE this changes MoE execution for the MAIN model too, not just
# the MTP draft — EP vs TP for the 512 routed experts is a real performance variable we
# have NOT A/B'd on this hardware. The old local-inference-lab quant needed none of this:
# its MTP experts were W4A16_NVFP4, which has no block-divisibility constraint.

recipe_version: "1"
name: Qwen3.8-Flash-Next-NVFP4 (Cluster, YaRN 1M, emosaru fork)
description: vLLM serving nvidia/Qwen3.8-Flash-Next-NVFP4 at 1M context via YaRN on a dual DGX Spark cluster

model: nvidia/Qwen3.8-Flash-Next-NVFP4
container: vllm-node-b12x

build_args:
  - --exp-b12x

cluster_only: true

mods: []
# Page-cache dropping (applied by the launcher, not declared here)
#   Drops the FS page cache every 60s (sync; echo 3 > /proc/sys/vm/drop_caches).
  # TWO reasons this is on, both GB10-specific:
  #   1. LOAD: on unified memory a warm page cache starves the GPU allocator partway
  #      through model load — the one GB10 gotcha reported for this model class, and we
  #      load 99 GiB right after (often) having just downloaded it.
  #   2. EARLYOOM: the loop's `sync` flushes DIRTY pages. MemAvailable counts clean
  #      reclaimable cache but NOT dirty-writeback backlog, and that backlog is what ate
  #      the head's margin on 2026-09-11 when a bulk download killed the serving engine
  #      (memory/earlyoom_head_kill.md). Keeping writeback short protects that margin.
  # NOT declared here: recipe `mods:` resolve against the EUGR checkout (run-recipe:
  # mod_path = SCRIPT_DIR / mod), so they cannot reference this repo. UPSTREAM'S
  # mods/drop-caches IS BROKEN ANYWAY — a double stdout redirection writes "3" to its
  # logfile instead of to /proc/sys/vm/drop_caches, so it never drops anything. The
  # launcher applies our corrected fork mods/drop-caches-fixed via --apply-mod instead.
  # Verify it took: `docker exec <container> cat /tmp/drop_caches.log` -> one
  # "<timestamp> dropped" line per minute. Seeing a bare "3" means the broken one ran.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 1000000
  yarn_factor: 4.0
  yarn_original: 262144
  max_num_seqs: 16
  max_num_batched_tokens: 4096
  num_speculative_tokens: 3
  gpu_memory_utilization: 0.7

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"

command: |
  vllm serve nvidia/Qwen3.8-Flash-Next-NVFP4 \
    --host {host} \
    --port {port} \
    --served-model-name Qwen/Qwen3.8-Flash-Next nvidia/Qwen3.8-Flash-Next-NVFP4 local-inference-lab/Qwen3.8-Flash-Next-NVFP4 \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --enable-expert-parallel \
    --enable-prefix-caching \
    --enable-prompt-tokens-details \
    --enable-force-include-usage \
    --enable-chunked-prefill \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --hf-overrides '{{"text_config": {{"ple_embedding_dtype": "float8_e4m3fn", "rope_parameters": {{"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": {yarn_factor}, "original_max_position_embeddings": {yarn_original}}}}}}}' \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --gpu-memory-utilization {gpu_memory_utilization}
