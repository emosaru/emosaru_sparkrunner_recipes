recipe_version: '2'
model: Qwen/Qwen3.6-35B-A3B-FP8
runtime: vllm-distributed
builder: eugr
container: vllm-node
metadata:
  description: "Qwen3.6-35B-A3B-FP8 — agentic-coding co-tenant (with 27B), native 256k"
mods:
- mods/fix-qwen3-coder-next
- mods/vllm-tune
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  # 0.38 × 121 GB ≈ 46 GB. The 27B (at util=0.40) loads first and consumes
  # ~74 GB (48 GB budget + ~25 GB CPU/process overhead), leaving ~47 GB free
  # for 35B's startup check. 0.40 here was 1.4 GB over that ceiling; 0.38
  # fits with margin. Sum 0.40+0.38 = 0.78, still under earlyoom's 80% line.
  gpu_memory_utilization: 0.38
  # 128k context. Trimmed from 200k for more memory headroom.
  max_model_len: 131072
  max_num_batched_tokens: 16384
  load_format: fastsafetensors
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
    --default-chat-template-kwargs '{"preserve_thinking": true}' \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
