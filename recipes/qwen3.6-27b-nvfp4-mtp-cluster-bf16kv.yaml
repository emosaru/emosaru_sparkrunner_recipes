recipe_version: '2'
model: emosaru/Qwen3.6-27B-NVFP4-MTP
runtime: vllm
builder: eugr
min_nodes: 2
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
metadata:
  description: "BF16 KV test — FLASH_ATTN_DIFFKV backend to probe FULL_AND_PIECEWISE CUDA graph ceiling. Util 0.60 (54 GB KV headroom/node vs 0.32 fp8 baseline). Benchmark this against cluster-fp8kv to measure FULL_AND_PIECEWISE uplift."
mods:
- mods/fix-nvfp4-mtp-weights
- mods/fix-qwen3-coder-next
- mods/fix-qwen3.6-chat-template
defaults:
  port: 8003
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  # 0.85 * 121 GB = 102.85 GB/node; model ~18.8 GB/node leaves ~84 GB KV for BF16.
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_batched_tokens: 32768
  load_format: fastsafetensors
  # BF16 KV (auto) — allows FLASH_ATTN_DIFFKV which supports FULL_AND_PIECEWISE
  # CUDA graph mode vs flashinfer's forced PIECEWISE with spec-decode.
  kv_cache_dtype: auto
  attention_backend: FLASH_ATTN
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 3}'
env:
  ENABLE_NVFP4_SM100: '0'
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  NCCL_CUMEM_ENABLE: '1'
  NCCL_SOCKET_IFNAME: 'enp1s0f0np0,enP2p1s0f0np0'

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --quantization modelopt \
    --chat-template fixed_chat_template.jinja \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --speculative-config '{speculative_config}' \
    --enable-prefix-caching \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
