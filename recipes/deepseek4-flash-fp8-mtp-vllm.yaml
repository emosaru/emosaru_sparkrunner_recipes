recipe_version: "2"
model: deepseek-ai/DeepSeek-V4-Flash
runtime: vllm
container: scitrera/dgx-spark-vllm-jasl-ds4:20260609
min_nodes: 2

metadata:
  description: >
    DeepSeek-V4-Flash FP8 MTP — 2-node TP=2 cluster, ray backend. Matches
    eugr's deepseek-v4-flash recipe (sparse MLA/DeepGEMM experimental SM120
    support), except: (1) the speculative-decode/MTP config is kept as a
    pre-expanded JSON default — eugr's inline '{{"method":"mtp",
    "num_speculative_tokens":{num_speculative_tokens}}}' template causes a
    sparkrun startup error; (2) container stays pinned to
    scitrera/dgx-spark-vllm-jasl-ds4:20260609 rather than eugr's vllm-node —
    that build patches vLLM's sparse attention indexer with a Triton
    fallback for SM120 (GB10), since DeepGEMM isn't available on this
    hardware. The generic vllm-node tag lacks that patch and hard-crashes
    with "Sparse Attention Indexer CUDA op requires DeepGEMM to be
    installed."

    Phase-1 stability hardening (2026-07-09): cudagraph_mode pinned to
    PIECEWISE (bare FULL_AND_PIECEWISE hangs ~6 requests in on SM12.x — the
    V4 indexer declares UNIFORM_BATCH, violated by chunked prefill, vLLM
    #40969) and Ray memory-monitor disabled (it reaps the engine under GB10
    unified-memory pressure). Run host-prep-spark.sh on BOTH nodes before
    launch for the unified-memory / earlyoom OOM class.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 500000
  block_size: 256
  max_num_seqs: 4
  max_num_batched_tokens: 8192
  load_format: instanttensor
  kv_cache_dtype: fp8
  tool_call_parser: deepseek_v4
  reasoning_parser: deepseek_v4
  tokenizer_mode: deepseek_v4
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 2}'
  reasoning_config: '{"reasoning_parser": "deepseek_v4", "reasoning_start_str": "", "reasoning_end_str": ""}'
  # Phase-1 stability: pin PIECEWISE cudagraphs (VLLM_USE_BREAKABLE_CUDAGRAPH=0 below keeps the
  # host-staged cross-node all-reduce out of the graph — no GPUDirect on GB10, vLLM #46253). If
  # PIECEWISE still capture-faults at capture_end, add `--enforce-eager` to the command as the
  # guaranteed-stable floor (~55% slower decode) until Phase 3 moves to a validated graphed image.
  compilation_config: '{"cudagraph_mode": "PIECEWISE"}'

env:
  DG_JIT_USE_NVRTC: "0"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  # Phase-1 stability: stop Ray's memory monitor reaping the EngineCore on false-positive
  # pressure readings against GB10 shared LPDDR5X. Required while distributed backend is ray.
  RAY_memory_monitor_refresh_ms: "0"
  TILELANG_CLEANUP_TEMP_FILES: "1"
  VLLM_TRITON_MLA_SPARSE: "1"
  VLLM_TRITON_MLA_SPARSE_HEAD_BLOCK_SIZE: "4"
  # jasl sm120_tp2 long-context profile: larger sparse-MLA chunks than vLLM
  # defaults (QUERY default 256 -> 512; TOPK matches default 512, set explicit).
  VLLM_TRITON_MLA_SPARSE_QUERY_CHUNK_SIZE: "512"
  VLLM_TRITON_MLA_SPARSE_TOPK_CHUNK_SIZE: "512"

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --kv-cache-dtype {kv_cache_dtype} \
    --block-size {block_size} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --compilation-config '{compilation_config}' \
    --speculative-config '{speculative_config}' \
    --tokenizer-mode {tokenizer_mode} \
    --distributed-executor-backend ray \
    --tool-call-parser {tool_call_parser} \
    --enable-auto-tool-choice \
    --reasoning-parser {reasoning_parser} \
    --reasoning-config '{reasoning_config}' \
    --default-chat-template-kwargs.thinking=true \
    --default-chat-template-kwargs.reasoning_effort=high \
    --load-format {load_format}
