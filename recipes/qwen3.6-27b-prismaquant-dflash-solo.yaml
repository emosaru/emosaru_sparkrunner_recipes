recipe_version: '2'
model: rdtand/Qwen3.6-27B-PrismaQuant-5.5bit-vllm
runtime: vllm
builder: eugr
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
metadata:
  description: "Qwen3.6-27B-PrismaQuant-5.5bit + DFlash spec decode (k=5), solo isolation test"
mods:
- mods/fix-qwen3-coder-next
- mods/fix-qwen3.5-chat-template
# Solo isolation variant of qwen3.6-27b-prismaquant-dflash-agentic.yaml.
# Same engine config except util raised 0.40 → 0.85 (~103 GiB budget) and
# num_gpu_blocks_override dropped (let vLLM size KV from the full budget).
# Used to verify whether DFlash + PrismaQuant + flashinfer + BF16 KV +
# eager works AT ALL on this Spark, separate from the co-tenant memory squeeze.
defaults:
  port: 8003
  host: 0.0.0.0
  gpu_memory_utilization: 0.85
  max_model_len: 131072
  max_num_seqs: 5
  load_format: fastsafetensors
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
env:
  VLLM_USE_V1: '1'
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '0'
command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --load-format {load_format} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --speculative-config '{"method":"dflash","model":"z-lab/Qwen3.6-27B-DFlash","num_speculative_tokens":5}' \
    --chat-template unsloth.jinja \
    --default-chat-template-kwargs '{"preserve_thinking": true}' \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser}
