recipe_version: '2'
model: emosaru/Qwen3.6-27B-NVFP4-MTP
runtime: vllm
builder: eugr
container: 192.168.1.236:5000/sparkrun-emosaru-vllm:latest
metadata:
  description: "Qwen3.6-27B NVFP4-MTP — single node (tp=1). Apples-to-apples vs cluster recipe; util raised to 0.45 (tp=1 carries full model weights vs 0.32/node at tp=2). Benchmark: ~17.6 tok/s single-stream, 103.7 tok/s @c=8."
mods:
- mods/fix-nvfp4-mtp-weights
- mods/fix-qwen3-coder-next
- mods/fix-qwen3.6-chat-template
defaults:
  port: 8003
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  # tp=1: full model (~37.6 GB) + KV cache on one node; 0.32 is the cluster per-node
  # budget (model sharded at tp=2) and is too small here. 0.45 ≈ 48.4 GB gives
  # ~10.8 GB KV headroom at 262k context while leaving hermes room on node 1.
  gpu_memory_utilization: 0.45
  max_model_len: 262144
  max_num_batched_tokens: 32768
  max_num_seqs: 16
  load_format: instanttensor
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 3}'
env:
  ENABLE_NVFP4_SM100: '0'
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --trust-remote-code \
    --quantization modelopt \
    --chat-template fixed_chat_template.jinja \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --speculative-config '{speculative_config}' \
    --enable-prefix-caching \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
