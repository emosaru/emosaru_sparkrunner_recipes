recipe_version: '2'
model: Qwen/Qwen3.6-35B-A3B-FP8
runtime: vllm
builder: eugr
min_nodes: 2
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
metadata:
  description: "Qwen3.6-35B-A3B-FP8 with MTP — 2-Spark cluster (tp=2), util 0.24, 128k context. Shared by agentic-coding (sonnet/haiku role) and llm-support-bot (main LLM). 256k KV allocation failed at cluster co-tenant budget; trimmed to 128k."
mods:
- mods/fix-qwen3-coder-next
- mods/fix-qwen3.6-chat-template
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  # Unified-stack co-tenant budget at FULL 256k context: 0.24 × 121 GB ≈ 29 GB/node.
  # 35B-A3B MoE (~3B active) is much lighter on KV than dense 27B: 4 KV heads ×
  # 48 layers ≈ 48 KB/token FP8 KV; under TP=2 each node holds 2 KV heads ≈
  # 24 KB/token/node → 262144 ctx ≈ 6.3 GB/node KV for one full-context seq.
  # Weights ~17.5 GB/node + workspace ~5 GB + KV pool ~6.5 GB ≈ ~29 GB/node.
  gpu_memory_utilization: 0.24
  max_model_len: 131072
  max_num_batched_tokens: 32768
  load_format: instanttensor
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 2}'
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  # re-enable CUDA memory pooling for NCCL (image default is 0)
  NCCL_CUMEM_ENABLE: '1'
  # remove 1GbE (enP7s7) from NCCL's socket fallback list; keep both 200Gb/s RoCE NICs
  NCCL_SOCKET_IFNAME: 'enp1s0f0np0,enP2p1s0f0np0'
command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --chat-template fixed_chat_template.jinja \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --speculative-config '{speculative_config}' \
    --enable-prefix-caching \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
