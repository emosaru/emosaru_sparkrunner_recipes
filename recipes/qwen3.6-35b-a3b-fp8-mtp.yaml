recipe_version: '2'
model: Qwen/Qwen3.6-35B-A3B-FP8
runtime: vllm
builder: eugr
min_nodes: 2
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
metadata:
  description: "Qwen3.6-35B-A3B-FP8 with MTP — 2-Spark cluster (tp=2), util 0.26, 128k context. Shared by agentic-coding (sonnet/haiku role) and llm-support-bot (main LLM). 256k KV alloc failed at co-tenant budget. CUDA graph profiler (new in vLLM v0.21.0) consumed 1.09 GiB making 0.24 negative; disabled profiler and raised to 0.26 for ~3 GB KV headroom."
mods:
- mods/fix-qwen3-coder-next
- mods/fix-qwen3.6-chat-template
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  # 0.26 × 121 GB ≈ 31.5 GB/node. Non-graph overhead (weights + workspace) measured
  # at 28.42 GB/node; leaves ~3.1 GB for KV cache at block_size=2128 (~144 blocks,
  # ~2.3× max_model_len capacity). Raised from 0.24: vLLM v0.21.0 CUDA graph profiler
  # consumed 1.09 GB upfront making 0.24 produce -0.47 GB KV. Profiler disabled via
  # VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0; 0.26 gives comfortable headroom.
  gpu_memory_utilization: 0.26
  max_model_len: 131072
  max_num_batched_tokens: 32768
  load_format: instanttensor
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_xml
  reasoning_parser: qwen3
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 2}'
env:
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  # vLLM v0.21.0 enabled CUDA graph memory profiling by default, consuming 1.09 GiB
  # upfront that broke KV allocation at util=0.24. Disable it; graphs still capture.
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '0'
  # re-enable CUDA memory pooling for NCCL (image default is 0)
  NCCL_CUMEM_ENABLE: '1'
  # remove 1GbE (enP7s7) from NCCL's socket fallback list; keep both 200Gb/s RoCE NICs
  NCCL_SOCKET_IFNAME: 'enp1s0f0np0,enP2p1s0f0np0'
command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --chat-template fixed_chat_template.jinja \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --speculative-config '{speculative_config}' \
    --enable-prefix-caching \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
