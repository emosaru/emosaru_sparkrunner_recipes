# Recipe: DeepSeek-V4-Flash-0731 with DSpark speculation — our port of eugr's
#         PENDING PR #319 (https://github.com/eugr/spark-vllm-docker/pull/319,
#         branch feat/deepseek-v4-flash-dspark -> main; NOT merged as of 2026-07-17),
#         migrated to the OFFICIAL 0731 release.
#
# DSpark variant of recipes/deepseek-v4-flash-mtp-eugr.yaml: SAME checkpoint
# (deepseek-ai/DeepSeek-V4-Flash-0731), speculation swapped from MTP to DSpark — a
# Markov multi-token speculation module (dspark_block_size 5, target layers
# [40,41,42], markov_rank 256). eugr reported ~4 tokens mean accept length /
# ~53 tok/s on code workloads on the preview; re-benchmark on 0731.
#
# ── 0731 BAKES DSpark IN — no separate download ──────────────────────────────────
# We used to point this at a distinct ~167 GB `deepseek-ai/DeepSeek-V4-Flash-DSpark`
# checkpoint. That is now obsolete: the official 0731 checkpoint's weight map is
# byte-identical to that -DSpark repo (72,317 tensors / 48 shards / 166.9 GB) — it
# carries the DSpark draft module already — AND it has the newer official
# re-post-training the standalone -DSpark repo (2026-07-04) predates. So this recipe
# and the MTP recipe share ONE resident 0731 checkpoint; the A/B between them is a
# clean --speculative-config flip, no re-download.
#
# Format is eugr recipe_version "1" so eugr's run-recipe.py parses it natively; run
# it by PATH through eugr's tooling via launch-deepseek-v4-flash-dspark-eugr.sh —
# NOT via sparkrun. See memory/eugr_direct_container_workflow.md.
#
# ── TWO HARD PREREQUISITES (the launcher handles both) ───────────────────────────
# 1. IMAGE: needs a `vllm-node` built from vLLM recent enough to carry the DSpark
#    method (vLLM #46995). A stale/cached image dies at startup with
#    "unknown speculative method 'dspark'". Rebuild: build-and-copy.sh --rebuild-vllm
#    (launcher: REBUILD_VLLM=1). The DeepSeek-V4 cute-DSL/preset fixes needed to load
#    on main (VLLM_PRESET_PRS 47392 47618) come with the main build automatically.
# 2. MODS: BOTH mods below must exist in the eugr checkout; the launcher stages both.
#    mods/fix-dspark-sm120-topk ships in PR #319 only, so the launcher fetches it out
#    of the PR (once #319 merges the fetch becomes a no-op and this note can go).
#    mods/fix-dspark-noncausal-topk-bucket is ours — canonical copy lives in this repo
#    and is copied into the eugr checkout on every launch, because that checkout is
#    disposable and a re-clone would silently drop it.
#
# ── WHY THE SECOND MOD, AND WHY IT MATTERS MORE THAN IT LOOKS ───────────────────
# PR #319's mod makes DSpark *run* on SM120; ours makes it run *fast*. vLLM sizes the
# draft's non-causal index list as cdiv(sliding_window + num_speculative_tokens, 128)*128
# = cdiv(128+5,128)*128 = 256, but FlashInfer's SM120 decode_dsv4 has buckets
# {128,512,1024} only. #319 resolves that by truncating indices[..., :128] — which drops
# the non-causal tail, i.e. exactly the speculative-token entries that let draft position
# k attend to its siblings. Output stays correct (the target verifies every proposal) but
# accept-length collapses, worst at deep positions. Our mod rounds the width UP to 512 so
# the kernel dispatches natively and nothing is discarded.
#
# A/B 2026-08-02, single-stream, temperature 0, median of 3 (this cluster, 0731, TP=2):
#              accept rate      mean accept len     tok/s (median)
#   depth 0    0.337 -> 0.464   2.68 -> 3.32        35.97 -> 42.30   (+17.6%)
#   depth 4k   0.370 -> 0.500   2.85 -> 3.50        35.86 -> 42.01
#   depth 16k  0.372 -> 0.525   2.86 -> 3.63        34.84 -> 48.39
#   depth 32k  0.407 -> 0.571   3.04 -> 3.85        39.12 -> 40.75
#   per-position acceptance @32k: 0.79/0.57/0.40/0.21/0.067 -> 0.85/0.71/0.58/0.42/0.31
# The tok/s column at depth is prefill-contaminated by the harness and noisy; depth 0
# (no prefill) is the trustworthy throughput figure. Acceptance is the clean signal and
# it improves at every depth, most at the deep draft positions the truncation was eating.
#
# NOTE this is NOT the bug described in tonyd2wild's DSpark-1M-NVFP4 repo (a DSpark
# weight loader dropping 12 shared-expert tensors, w1/w3 never mapped to gate_up_proj).
# That one is ALREADY FIXED in our vLLM: the rewritten loader at
# vllm/models/deepseek_v4/nvidia/dspark.py carries ("gate_up_proj","w1"/"w3") in its
# stacked_params_mapping, and the log confirms "DSpark draft model loaded: 96 params"
# with no skips. Same symptom (halved acceptance, perfect output), different cause —
# do not go chasing the loader.
#
# ── WHY THE FIRST MOD (SM120 / DGX Spark GB10) ──────────────────────────────────
# The DSpark draft runs a sparse-MLA decode with topk=256, but FlashInfer's SM120
# decode_dsv4 kernel only has compiled buckets {128,512,1024}. topk=256 falls in the
# gap, the dispatcher falls through to the paged kernel, and warmup crashes on
# `num_tokens > 64`. The mod rounds the draft's topk down to 128 before dispatch.
# Correctness-safe: the draft is a speculator and the target model verifies every
# proposed token, so this moves accept-length, never output. (The main model asks for
# topk=128 and is unaffected.) Drop the mod on kernels that support topk=256.
#
# ── OUR DELTAS vs PR #319 (this cluster only — everything else is verbatim) ──────
# * gpu_memory_utilization 0.85 — the PR's value, kept as-is. Note this is ABOVE the
#   MTP sibling's 0.77: that recipe was tuned conservatively (util ~0.80+ was blamed
#   for a cron-burst crash under the old jasl/Ray-overhead config), and the ~97 GiB
#   free figure in memory/cluster_topology.md was measured with a desktop session +
#   browser resident. 0.85 (≈103 GiB) is confirmed fine on this cluster (user,
#   2026-07-17). Overridable from the launcher (GPU_MEM=…), so the memory decision
#   stays in one place. On first launch still read the "GPU KV cache size" line —
#   a full 200k fp8 request needs ~2.1 GiB of KV; if KV lands near that, lower
#   max_model_len rather than climbing util further.
# * RAY_memory_monitor_refresh_ms=0 — Ray's memory monitor reaps the EngineCore on
#   false-positive pressure readings against GB10 shared LPDDR5X. Required on this
#   hardware whenever the backend is ray (it is, below). Same as the MTP recipe.
# * NOT ported from the MTP recipe: the jasl container pin and the
#   VLLM_TRITON_MLA_SPARSE* env block. Those exist because that image patches the
#   sparse-MLA indexer with a Triton fallback (no DeepGEMM on GB10). This recipe runs
#   the stock image, whose SM120 sparse-MLA path is FlashInfer's — which is precisely
#   what the topk mod above patches. Mixing the two would be wrong.
# * NOT set: compilation_config cudagraph_mode PIECEWISE. The MTP recipe pins it
#   (bare FULL_AND_PIECEWISE hangs ~6 requests in on SM12.x — the V4 indexer declares
#   UNIFORM_BATCH, violated by chunked prefill, vLLM #40969). PR #319 does not set it
#   and its numbers are from the unpinned config, so we match the PR to stay on the
#   benchmarked path. If this hangs a handful of requests in, that is the #40969
#   signature — add: compilation_config: '{"cudagraph_mode": "PIECEWISE"}' to defaults
#   and the matching --compilation-config '{compilation_config}' to the command.
#
# Run host-prep-spark.sh on BOTH nodes before launch (unified-memory / earlyoom OOM
# class), same as the MTP recipe.

recipe_version: "1"
name: DeepSeek-V4-Flash-0731-DSpark-eugr
description: deepseek-ai/DeepSeek-V4-Flash-0731 (DSpark speculation, TP=2 Ray) on the stock eugr image — port of eugr PR #319

# HuggingFace model — the OFFICIAL 0731 checkpoint, which BAKES the DSpark module in
# (its weight map is byte-identical to the old standalone -DSpark repo, but 0731 also
# carries the official re-post-training the standalone repo predates). Same ~167 GB
# checkpoint the MTP recipe uses — download once, both recipes share it.
model: deepseek-ai/DeepSeek-V4-Flash-0731

# Stock eugr image tag (built by ./build-and-copy.sh -> eugr/spark-vllm:latest -> vllm-node).
# Must include vLLM #46995 — see prerequisite 1 above.
container: vllm-node

# Claims essentially the whole 2-Spark cluster; both nodes required.
cluster_only: true

# DSpark draft topk fixes for SM120 — resolved relative to the eugr repo root.
#
# fix-dspark-noncausal-topk-bucket (OURS) must come first conceptually: it widens the
# draft's non-causal index list from 256 to 512 so FlashInfer's SM120 decode_dsv4 has a
# compiled bucket for it natively. fix-dspark-sm120-topk (from PR #319, fetched by the
# launcher) then no-ops — 512 is already a supported bucket — and stays only as a
# fallback for shapes the rounding cannot reach.
#
# WITHOUT the bucket mod, PR #319's mod rescues the dispatch by truncating
# indices[..., :128], which drops the non-causal tail (the speculative tokens each draft
# position needs to see its siblings) and guts accept-length. See that mod's header for
# the full mechanism and the measured A/B.
mods:
  - mods/fix-dspark-noncausal-topk-bucket
  - mods/fix-dspark-sm120-topk

# Default settings (can be overridden via CLI). gpu_memory_utilization is the
# per-node fraction of the ~121 GB unified pool and is overridable from the launcher
# (GPU_MEM=…), so the memory decision stays in one place.
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  # PR #319's value. DSpark's persistent draft adds memory pressure the MTP recipe
  # doesn't have; 0.85 / 200k loads the draft cleanly and sizes a healthy KV pool.
  gpu_memory_utilization: 0.85
  max_model_len: 200000
  block_size: 256
  max_num_seqs: 4
  # Kept at 8192 (the eugr default). A 2026-08-01 llama-benchy A/B showed that raising
  # it to 12288 only helped SHALLOW-context concurrency (c4 @ d0 +69%, c2 @ d4k +70%)
  # while leaving the deep-context collapse untouched (c2/c4 @ d16-32k unchanged —
  # that regime is prefill/sparse-MLA-indexer bound, not batch-slot starved) AND it
  # shrank the KV pool 457k -> 298k tokens (200k concurrency 2.29x -> 1.49x). Net
  # neutral for our single-stream agentic workload, so we kept the larger KV pool.
  # CEILING (measured): 16384 does NOT fit at util 0.85 / max_model_len 200000 — the
  # activation profile grows ~4.6 GiB and KV falls to 13.73 GiB vs the 14.46 GiB a
  # 200k sequence needs → engine aborts at KV-cache init. To raise this you must trade
  # KV: lower max_model_len (200k -> ~150k) or raise gpu_memory_utilization (risks the
  # earlyoom cliff — ~1 GB MemAvailable headroom at 0.85).
  max_num_batched_tokens: 8192
  # DSpark requires num_speculative_tokens >= dspark_block_size (5). Do not lower it.
  # 5 is our validated optimum. A 2026-08-01 llama-benchy A/B of the upstream
  # recipes.vllm.ai default (7 + draft_sample_method:greedy) vs this (5 +
  # probabilistic) found 7/greedy WORSE: single-stream decode at depth fell ~30-35%
  # (29.9 -> 20.5 t/s @32k) and accept length dropped 2.38 -> 1.71 tok/step. The
  # `greedy` sampler agrees with the DSpark Markov draft less than `probabilistic`;
  # PR #319's 5/probabilistic is tuned for this checkpoint. Keep 5.
  # RE-TEST PENDING (2026-08-02): that A/B ran while the draft was being truncated to
  # topk=128, which crushed the deep draft positions — exactly the positions a larger
  # num_speculative_tokens depends on. With fix-dspark-noncausal-topk-bucket in place
  # position 4 now accepts at 0.31 (was 0.067), so 7 may no longer lose. Worth re-running
  # before treating 5 as settled. Note the width itself is bucket-quantized now: any
  # value 1..383 lands on 512, so raising it costs no extra draft attention width.
  num_speculative_tokens: 5

# Environment variables
env:
  DG_JIT_USE_NVRTC: "0"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  # Our delta — see header. Keeps Ray's memory monitor from reaping the EngineCore.
  RAY_memory_monitor_refresh_ms: "0"

# The vLLM serve command template
command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
      --host {host} \
      --port {port} \
      --served-model-name deepseek-ai/DeepSeek-V4-Flash deepseek-ai/DeepSeek-V4-Flash-0731 \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype fp8_ds_mla \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --enable-prompt-tokens-details \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic"}}' \
      --tokenizer-mode deepseek_v4 \
      --distributed-executor-backend ray \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --load-format instanttensor
